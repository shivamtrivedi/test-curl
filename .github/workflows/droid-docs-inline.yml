name: Droid Docs Inline
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: droid-docs-inline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest-inline-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/droid --version

      - name: Prepare context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.git/pr_context';
            fs.mkdirSync(path, { recursive: true });

            const prNumber = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const reduced = files.map(f => ({ filename: f.filename, patch: f.patch }));
            fs.writeFileSync(`${path}/files.json`, JSON.stringify(reduced, null, 2));

            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            try {
              const diff = execSync(`git diff ${base}...${head}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              fs.writeFileSync(`${path}/diff.txt`, diff);
            } catch (e) {
              fs.writeFileSync(`${path}/diff.txt`, '');
            }

      - name: Get changed C files
        id: changed-files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep -E '\.(c|h)$' > changed_files.txt || true
          if [ -s changed_files.txt ]; then
            echo "has_c_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_c_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Suggest inline comments
        if: steps.changed-files.outputs.has_c_files == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          cp .git/pr_context/files.json ./files.json
          cp .git/pr_context/diff.txt ./diff.txt

          cat > prompt.txt << 'EOF'
          You are an automated documentation review system. Review the PR diff and suggest inline comments to explain complex logic in C/H files.

          Input files (already in current directory):
          - diff.txt: the code changes to review
          - files.json: file patches with line numbers for positioning comments
          - changed_files.txt: list of changed C/H files

          Task: Create comments.json with this exact format:
          [{ "path": "path/to/file.c", "position": 42, "body": "Your suggestion here" }]

          Focus on:
          - Complex conditionals
          - Bit manipulation
          - Buffer operations
          - Error handling

          Comment style:
          - Use // for inline comments
          - Explain WHY and WHAT, not HOW
          - Keep brief (1-2 lines)
          - Don't over-comment trivial code

          Comment format:
          - Use GitHub's suggestion block to propose the exact inline comment
          - Keep suggestions concise and technical

          Positioning:
          - Use the "position" value derived from files.json patches (diff line numbers, not file line numbers)
          - Only comment on changed lines present in the diff hunk

          Output:
          - Write comments.json containing either [] or an array of objects with path, position, body
          EOF

          droid exec --auto medium --model gpt-5.2 -f prompt.txt

          if [ ! -f comments.json ]; then
            echo "[]" > comments.json
          fi
          echo "=== Contents of comments.json ==="
          cat comments.json

      - name: Submit inline suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            if (!fs.existsSync('comments.json')) return;

            const comments = JSON.parse(fs.readFileSync('comments.json','utf8'));
            if (!Array.isArray(comments) || comments.length === 0) {
              core.info('No inline comment suggestions needed');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'COMMENT',
              body: 'Automated inline comment suggestions',
              comments: comments
            });
