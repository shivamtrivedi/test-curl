name: Droid Docs README
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: droid-docs-readme-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/droid --version

      - name: Prepare context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.git/pr_context';
            fs.mkdirSync(path, { recursive: true });

            const prNumber = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const reduced = files.map(f => ({ filename: f.filename, patch: f.patch }));
            fs.writeFileSync(`${path}/files.json`, JSON.stringify(reduced, null, 2));

            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            try {
              const diff = execSync(`git diff ${base}...${head}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              fs.writeFileSync(`${path}/diff.txt`, diff);
            } catch (e) {
              fs.writeFileSync(`${path}/diff.txt`, '');
            }

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Suggest README updates
        if: steps.changed-files.outputs.has_changes == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          cp .git/pr_context/files.json ./files.json
          cp .git/pr_context/diff.txt ./diff.txt

          echo "Files prepared:"
          ls -la *.json *.txt diff.txt 2>/dev/null || true

          cat > prompt.txt << 'EOF'
          You are an automated documentation system. Review the PR diff and suggest README.md updates if substantial new functionality was added.

          Input files (already in current directory):
          - diff.txt: the code changes to review
          - files.json: file patches with line numbers for positioning comments
          - changed_files.txt: list of changed files
          - README.md: current README content

          Task: Create comments.json with this exact format:
          [{ "path": "README.md", "position": 1, "body": "Your comment here" }]

          When to suggest updates:
          - New features, functions, or modules added
          - New command-line options or configuration
          - Changed behavior that users should know about
          - Only suggest if substantial new functionality was added

          Comment format (body):
          - DO NOT use GitHub suggestion blocks (```suggestion) - they will delete content
          - Instead, write a plain text comment that:
            1. Explains what README update is needed and why
            2. Provides the exact text to add in a markdown code block
          - Example body format:
            "The README should document this new feature. Add this section:\n```markdown\n## New Feature\nDescription here...\n```"
          - Keep style consistent with existing README.
          - Be concise but informative.
          - Include simple usage examples if applicable.
          - Keep language precise and technical. No emojis.

          Positioning:
          - Use position 1 for general README suggestions (top-level comment).
          - If suggesting changes to specific lines, use the position from files.json patches.

          Output:
          - Write comments.json containing either [] or an array of objects with path, position, body as specified above.
          - If no README updates needed, write [].
          EOF

          echo "Running droid exec..."
          droid exec --output-format debug --auto medium --model gpt-5.2 -f prompt.txt 2>&1

          if [ ! -f comments.json ]; then
            echo "No comments.json created, writing empty array"
            echo "[]" > comments.json
          fi

          echo "=== Contents of comments.json ==="
          cat comments.json

      - name: Submit inline suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            if (!fs.existsSync('comments.json')) {
              core.info('comments.json missing; skipping');
              return;
            }

            const comments = JSON.parse(fs.readFileSync('comments.json','utf8'));
            if (!Array.isArray(comments) || comments.length === 0) {
              core.info('No README suggestions needed');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'COMMENT',
              body: 'Automated README documentation suggestions',
              comments: comments
            });
