name: Droid Exec - Documentation Suite
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - doc-demo
      - security-droid
      - master

concurrency:
  group: droid-exec-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-document:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR branch with write permissions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Configure git user
        run: |
          git config user.name "factory-droid[bot]"
          git config user.email "138933559+factory-droid[bot]@users.noreply.github.com"

      - name: Setup droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/droid --version

      - name: Prepare context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.git/doc_context';
            fs.mkdirSync(path, { recursive: true });

            const prNumber = context.payload.pull_request.number;
            
            // Fetch changed files with patches
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            
            const cFiles = files.filter(f => f.filename.endsWith('.c') || f.filename.endsWith('.h'));
            fs.writeFileSync(`${path}/changed_files.json`, JSON.stringify(cFiles, null, 2));
            
            // Create diff
            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            try {
              const diff = execSync(`git diff ${base}...${head}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              fs.writeFileSync(`${path}/diff.txt`, diff);
            } catch (e) {
              fs.writeFileSync(`${path}/diff.txt`, '');
            }
            
            // Save PR info
            const prInfo = {
              number: prNumber,
              title: context.payload.pull_request.title,
              body: context.payload.pull_request.body,
              base_branch: context.payload.pull_request.base.ref,
              head_branch: context.payload.pull_request.head.ref
            };
            fs.writeFileSync(`${path}/pr_info.json`, JSON.stringify(prInfo, null, 2));

      - name: Step 1 - Add Doxygen Comments
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          echo "=== Step 1: Adding Doxygen Comments ==="
          
          # Copy context files
          cp .git/doc_context/changed_files.json ./changed_files.json
          cp .git/doc_context/diff.txt ./diff.txt
          
          cat > doxygen-prompt.txt << 'EOF'
          You are a documentation specialist for the curl project. Analyze the changed C files and add Doxygen-style documentation comments to all functions that lack them.

          Available files:
          - changed_files.json: List of changed files in this PR
          - diff.txt: The actual code changes
          - review_guidelines.md: Code standards (section 5 covers documentation)

          Task: Add Doxygen comments for all functions in new or modified C files

          Doxygen Comment Requirements:
          - Use /** ... */ style for Doxygen blocks
          - Place immediately before function definition
          - Include brief description on first line
          - Document all parameters with @param
          - Document return value with @return
          - Note any side effects or preconditions
          - Mention error conditions where applicable

          Example format:
          /**
           * Parse port number from string with validation.
           * 
           * @param port_str String containing port number (1-65535)
           * @param out_port Pointer to store parsed port value
           * @return 0 on success, -1 if port_str is NULL, -2 if out of range
           */

          Rules:
          - Only add comments to functions that completely lack documentation
          - Do NOT modify existing comments
          - Do NOT modify function implementations
          - Follow curl project's documentation style (check existing files for reference)
          - Keep descriptions technical and precise, no marketing language

          Output:
          - Directly edit the C/H files to add Doxygen comments
          - Only touch files listed in changed_files.json
          - Make minimal changes (documentation only)
          EOF

          echo "Running droid exec for Doxygen comments..."
          droid exec --auto medium --model gpt-4o -f doxygen-prompt.txt 2>&1 | tee droid-step1.log || true
          
          # Check if any files were modified
          if git diff --quiet; then
            echo "No Doxygen comments were added (files may already be documented)"
            echo "skip_step1=true" >> $GITHUB_ENV
          else
            echo "Doxygen comments added successfully"
            git add -A
            git commit -m "docs: Add Doxygen comments to new functions

Co-authored-by: factory-droid[bot] <138933559+factory-droid[bot]@users.noreply.github.com>" || echo "No changes to commit"
            echo "skip_step1=false" >> $GITHUB_ENV
          fi

      - name: Step 2 - Add Inline Explanatory Comments
        if: always()
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          echo "=== Step 2: Adding Inline Comments ==="
          
          cat > inline-prompt.txt << 'EOF'
          You are a code clarity specialist. Analyze the changed C files and add inline comments to explain complex logic, algorithms, or non-obvious code sections.

          Available files:
          - changed_files.json: List of changed files
          - diff.txt: Code changes
          - review_guidelines.md: Comment guidelines (section 4)

          Task: Add inline explanatory comments for complex code blocks

          Focus areas:
          - Complex conditional logic (nested ifs, multiple conditions)
          - Bit manipulation operations
          - Mathematical calculations or algorithms
          - Buffer/memory operations with bounds checking
          - Error handling flows
          - Non-obvious optimizations or workarounds

          Comment Style:
          - Use // for inline comments
          - Place on the line before the code being explained
          - Explain WHY and WHAT, not HOW (code shows how)
          - Keep brief (1-2 lines max per comment)
          - Use technical language

          Example:
          // Ensure buffer has space for string + null terminator
          if (len >= sizeof(buf) - 1) {
              return -1;
          }

          Rules:
          - Only add comments where code is genuinely complex
          - Do NOT over-comment trivial operations
          - Do NOT modify existing comments
          - Do NOT change any code logic
          - Focus on files from changed_files.json

          Output:
          - Edit C/H files to add inline comments
          - Preserve all existing formatting
          EOF

          echo "Running droid exec for inline comments..."
          droid exec --auto medium --model gpt-4o -f inline-prompt.txt 2>&1 | tee droid-step2.log || true
          
          if git diff --quiet; then
            echo "No inline comments were added"
            echo "skip_step2=true" >> $GITHUB_ENV
          else
            echo "Inline comments added successfully"
            git add -A
            git commit -m "docs: Add explanatory inline comments

Co-authored-by: factory-droid[bot] <138933559+factory-droid[bot]@users.noreply.github.com>" || echo "No changes to commit"
            echo "skip_step2=false" >> $GITHUB_ENV
          fi

      - name: Step 3 - Update README
        if: always()
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          echo "=== Step 3: Updating README ==="
          
          cat > readme-prompt.txt << 'EOF'
          You are a technical writer for the curl project. Update the README.md file to document new functionality added in this PR.

          Available files:
          - changed_files.json: Changed files in PR
          - diff.txt: Code changes showing new functions/features
          - README.md: Main project README

          Task: Add a section or update existing content in README.md to document new utilities/functions

          Guidelines:
          - Identify what new functionality was added (new files, new functions, new features)
          - Add content to appropriate section of README.md
          - If it's a new utility module, add a brief description with usage example
          - Keep the style consistent with existing README content
          - Be concise but informative
          - Include a simple code example if applicable

          Format:
          - Use markdown formatting
          - Follow existing README structure
          - Add new sections at appropriate locations
          - Use code blocks for examples

          Example section:
          ## Network Utilities

          The `lib/util_network.c` module provides helper functions for URL and network operations:

          - `parse_port_number()` - Parse and validate port numbers
          - `validate_hostname()` - Validate hostname format
          - `build_url_authority()` - Construct URL authority section

          Rules:
          - Only update README.md if substantial new functionality was added
          - Do NOT remove existing content
          - Keep changes minimal and focused
          - Match the tone and style of existing README

          Output:
          - Edit README.md to add new documentation
          EOF

          echo "Running droid exec for README update..."
          droid exec --auto medium --model gpt-4o -f readme-prompt.txt 2>&1 | tee droid-step3.log || true
          
          if git diff --quiet README.md 2>/dev/null; then
            echo "README was not updated (may not need updates)"
            echo "skip_step3=true" >> $GITHUB_ENV
          else
            echo "README updated successfully"
            git add README.md
            git commit -m "docs: Update README with new utilities

Co-authored-by: factory-droid[bot] <138933559+factory-droid[bot]@users.noreply.github.com>" || echo "No changes to commit"
            echo "skip_step3=false" >> $GITHUB_ENV
          fi

      - name: Step 4 - Create API Documentation
        if: always()
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          echo "=== Step 4: Creating API Documentation ==="
          
          cat > api-docs-prompt.txt << 'EOF'
          You are a technical documentation writer. Create comprehensive API documentation for new code added in this PR.

          Available files:
          - changed_files.json: New/modified files
          - diff.txt: Code changes
          - docs/ folder: Existing documentation for reference

          Task: Create a new documentation file in docs/ for new modules or substantial additions

          Documentation File Should Include:
          1. Title and overview of the module/functionality
          2. List of all public functions with signatures
          3. Detailed description of each function
          4. Parameters and return values
          5. Usage examples
          6. Error handling notes
          7. Related functions or dependencies

          File Naming:
          - For new lib/util_network.c → create docs/util_network.md
          - For modifications to existing files → update corresponding doc if it exists

          Format:
          - Use markdown
          - Follow structure similar to existing docs in docs/ folder
          - Include code examples in code blocks
          - Use headers (##) for sections
          - Use bullet points for lists

          Example structure:
          # Network Utilities API

          ## Overview
          Brief description of what this module does.

          ## Functions

          ### parse_port_number
          ```c
          int parse_port_number(const char *port_str, int *out_port);
          ```
          Detailed description...

          **Parameters:**
          - `port_str`: Input string
          - `out_port`: Output pointer

          **Returns:** Status code

          **Example:**
          ```c
          int port;
          if (parse_port_number("8080", &port) == 0) {
              // success
          }
          ```

          Rules:
          - Only create docs if new significant functionality was added
          - Place in docs/ directory
          - Do NOT create duplicate docs if one already exists
          - Keep technical and precise

          Output:
          - Create new .md file(s) in docs/ directory
          EOF

          echo "Running droid exec for API documentation..."
          droid exec --auto medium --model gpt-4o -f api-docs-prompt.txt 2>&1 | tee droid-step4.log || true
          
          if git diff --quiet docs/ 2>/dev/null && [ -z "$(git ls-files --others --exclude-standard docs/ 2>/dev/null)" ]; then
            echo "No API documentation was created"
            echo "skip_step4=true" >> $GITHUB_ENV
          else
            echo "API documentation created successfully"
            git add docs/
            git commit -m "docs: Add API documentation

Co-authored-by: factory-droid[bot] <138933559+factory-droid[bot]@users.noreply.github.com>" || echo "No changes to commit"
            echo "skip_step4=false" >> $GITHUB_ENV
          fi

      - name: Push documentation commits
        if: always()
        run: |
          echo "Pushing commits to PR branch..."
          git log --oneline -10
          
          # Count commits made by bot
          BOT_COMMITS=$(git log --author="factory-droid\[bot\]" --oneline origin/${{ github.event.pull_request.base.ref }}..HEAD 2>/dev/null | wc -l || echo "0")
          echo "Found $BOT_COMMITS documentation commits"
          
          if [ "$BOT_COMMITS" -gt 0 ]; then
            git push origin HEAD
            echo "✅ Pushed $BOT_COMMITS documentation commit(s)"
          else
            echo "ℹ️  No documentation commits to push"
          fi

      - name: Post summary comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const skip1 = process.env.skip_step1 === 'true';
            const skip2 = process.env.skip_step2 === 'true';
            const skip3 = process.env.skip_step3 === 'true';
            const skip4 = process.env.skip_step4 === 'true';
            
            let summary = '## 📚 Droid Documentation Suite Results\n\n';
            summary += 'Automated documentation analysis completed:\n\n';
            
            const steps = [
              { name: 'Doxygen Comments', skipped: skip1, emoji: '📝' },
              { name: 'Inline Comments', skipped: skip2, emoji: '💬' },
              { name: 'README Update', skipped: skip3, emoji: '📖' },
              { name: 'API Documentation', skipped: skip4, emoji: '📄' }
            ];
            
            let commitCount = 0;
            for (const step of steps) {
              if (step.skipped) {
                summary += `- ${step.emoji} **${step.name}**: No changes needed\n`;
              } else {
                summary += `- ${step.emoji} **${step.name}**: ✅ Added\n`;
                commitCount++;
              }
            }
            
            summary += `\n**Total documentation commits:** ${commitCount}\n\n`;
            
            if (commitCount > 0) {
              summary += '✨ Documentation has been automatically added to this PR. Please review the commits and merge when ready.\n\n';
              summary += '_Generated by [Factory Droid](https://factory.ai)_';
            } else {
              summary += 'ℹ️  No documentation additions were needed. Code may already be well-documented.\n\n';
              summary += '_Generated by [Factory Droid](https://factory.ai)_';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: summary
            });

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-exec-docs-${{ github.event.pull_request.number }}
          path: |
            droid-step*.log
            *-prompt.txt
            changed_files.json
            diff.txt
            .git/doc_context/*.json
          if-no-files-found: ignore
          retention-days: 14
