name: Droid Docs API
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: droid-docs-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest-api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/droid --version

      - name: Prepare context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.git/pr_context';
            fs.mkdirSync(path, { recursive: true });

            const prNumber = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const reduced = files.map(f => ({ filename: f.filename, patch: f.patch }));
            fs.writeFileSync(`${path}/files.json`, JSON.stringify(reduced, null, 2));

            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            try {
              const diff = execSync(`git diff ${base}...${head}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              fs.writeFileSync(`${path}/diff.txt`, diff);
            } catch (e) {
              fs.writeFileSync(`${path}/diff.txt`, '');
            }

      - name: Get new lib files
        id: changed-files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep -E '^lib/.*\.(c|h)$' > new_lib_files.txt || true
          if [ -s new_lib_files.txt ]; then
            echo "has_lib_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_lib_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Suggest API documentation
        if: steps.changed-files.outputs.has_lib_files == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          cp .git/pr_context/files.json ./files.json
          cp .git/pr_context/diff.txt ./diff.txt

          cat > prompt.txt << 'EOF'
          You are an automated documentation review system. Review the PR diff and suggest API documentation for new library code.

          Input files (already in current directory):
          - diff.txt: the code changes to review
          - files.json: file patches with line numbers for positioning comments
          - new_lib_files.txt: list of new/changed lib files

          Task: Create comments.json with this exact format:
          [{ "path": "lib/filename.c", "position": 42, "body": "Your suggestion here" }]

          Documentation to suggest:
          - Title and module overview
          - Function list with signatures
          - Detailed descriptions
          - Parameters and return values
          - Usage examples
          - Error handling notes

          Comment format:
          - Use GitHub's suggestion block to propose API documentation
          - IMPORTANT: Suggestion blocks REPLACE the line they're on, so you MUST include the original code line after your comment
          - For new files, suggest creating docs/filename.md
          - Keep suggestions concise and technical

          Positioning:
          - Use the "position" value derived from files.json patches (diff line numbers, not file line numbers)
          - Only comment on changed lines present in the diff hunk

          Output:
          - Write comments.json containing either [] or an array of objects with path, position, body
          EOF

          droid exec --auto medium --model gpt-5.2 -f prompt.txt

          if [ ! -f comments.json ]; then
            echo "[]" > comments.json
          fi
          echo "=== Contents of comments.json ==="
          cat comments.json

      - name: Submit inline suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            if (!fs.existsSync('comments.json')) return;

            const comments = JSON.parse(fs.readFileSync('comments.json','utf8'));
            if (!Array.isArray(comments) || comments.length === 0) {
              core.info('No API documentation suggestions needed');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'COMMENT',
              body: 'Automated API documentation suggestions',
              comments: comments
            });
