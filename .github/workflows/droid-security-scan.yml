name: Security Droid Scan
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep
          semgrep --version

      - name: Run Semgrep Security Scan
        id: semgrep
        continue-on-error: true
        run: |
          echo "Running Semgrep with C security rules..."
          
          # Run semgrep with C security rules and output JSON
          semgrep --config "p/c" \
                  --config "p/security-audit" \
                  --json \
                  --output semgrep-results.json \
                  . || true
          
          # Check if results file exists and has findings
          if [ -f semgrep-results.json ]; then
            echo "Semgrep scan completed"
            cat semgrep-results.json | jq '.results | length' > semgrep-count.txt
            FINDINGS=$(cat semgrep-count.txt)
            echo "semgrep_findings=$FINDINGS" >> $GITHUB_OUTPUT
            echo "Found $FINDINGS Semgrep issues"
          else
            echo "0" > semgrep-count.txt
            echo "semgrep_findings=0" >> $GITHUB_OUTPUT
            echo "No Semgrep results file generated"
          fi

      - name: Setup droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/droid --version

      - name: Prepare context for Droid
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.git/security_review';
            fs.mkdirSync(path, { recursive: true });

            const prNumber = context.payload.pull_request.number;
            
            // Fetch existing PR comments
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            fs.writeFileSync(`${path}/existing_comments.json`, JSON.stringify(comments, null, 2));

            // Fetch changed files with patches
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const reduced = files.map(f => ({ filename: f.filename, patch: f.patch, status: f.status }));
            fs.writeFileSync(`${path}/files.json`, JSON.stringify(reduced, null, 2));

            // Create diff via git
            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            try {
              const diff = execSync(`git diff ${base}...${head}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              fs.writeFileSync(`${path}/diff.txt`, diff);
            } catch (e) {
              fs.writeFileSync(`${path}/diff.txt`, '');
            }

      - name: Run Droid Security Analysis
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 15
        run: |
          # Copy context files to current directory
          cp .git/security_review/existing_comments.json ./existing_comments.json
          cp .git/security_review/files.json ./files.json
          cp .git/security_review/diff.txt ./diff.txt
          
          # Ensure Semgrep results exist (already in current dir from previous step)
          if [ ! -f semgrep-results.json ]; then
            echo '{"results":[]}' > ./semgrep-results.json
          fi

          echo "Files prepared for Droid analysis:"
          ls -la *.json diff.txt 2>/dev/null || true

          cat > security-prompt.txt << 'EOF'
          You are a security auditor for the curl project. Review the PR diff and produce inline security comments.

          Input files (already in current directory):
          - diff.txt: the code changes to review
          - files.json: file patches with line numbers for positioning comments
          - existing_comments.json: skip issues already mentioned here
          - semgrep-results.json: pattern-based findings from Semgrep (reference but don't duplicate)
          - docs/libcurl/libcurl-security.md: curl's security guidelines
          - review_guidelines.md: code quality guidelines

          Task: Create security-comments.json with this exact format:
          [{ "path": "path/to/file.c", "position": 42, "body": "Your comment here" }]

          Security checks (reference docs/libcurl/libcurl-security.md and review_guidelines.md):
          1. Memory Safety: Buffer overflows (strcpy, sprintf), use-after-free, double-free, NULL dereferences
          2. Integer Safety (§7.3.1): Overflows, underflows, sign conversions
          3. Input Validation: Unvalidated input, format strings, injection
          4. Resource Management: Memory/file descriptor leaks
          5. Authentication: Credential handling, weak crypto
          6. Race Conditions: TOCTOU issues
          7. API Misuse: Incorrect curl API usage

          Comment format:
          **[SEVERITY]** Issue title

          Guideline: <section reference>

          Detailed explanation and why it matters.

          Suggested fix:
          <concrete recommendation>

          Important:
          - Use "position" field from files.json patches (diff line positions, not file line numbers)
          - Only comment on changed lines visible in the diff
          - Don't duplicate Semgrep findings
          - Keep severity tags: CRITICAL, HIGH, MEDIUM, LOW
          - Output ONLY security-comments.json, no other text
          EOF

          echo "Running Droid security analysis..."
          droid exec --output-format debug --auto medium --model gpt-5.1-codex -f security-prompt.txt 2>&1 || true

          # Check if droid created the output
          if [ ! -f security-comments.json ]; then
            echo "⚠️  Droid did not create security-comments.json, creating empty array"
            echo '[]' > security-comments.json
          fi

          echo "=== Droid Security Analysis Results ==="
          cat security-comments.json || echo "[]" > security-comments.json

      - name: Convert Semgrep results to inline comment format
        if: always()
        run: |
          if [ ! -f semgrep-results.json ]; then
            echo '[]' > semgrep-comments.json
            exit 0
          fi

          # Convert Semgrep to inline comment format with diff positions
          python3 << 'EOFPYTHON'
          import json
          import re

          try:
              with open('semgrep-results.json', 'r') as f:
                  semgrep_data = json.load(f)
              
              with open('.git/security_review/files.json', 'r') as f:
                  files_data = json.load(f)
              
              # Build map of file:line to diff position
              def parse_patch_positions(patch):
                  """Parse patch to map file lines to diff positions"""
                  if not patch:
                      return {}
                  
                  positions = {}
                  diff_position = 0
                  current_line = 0
                  
                  for line in patch.split('\n'):
                      diff_position += 1
                      
                      # Parse hunk header: @@ -old +new @@
                      hunk_match = re.match(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@', line)
                      if hunk_match:
                          current_line = int(hunk_match.group(1))
                          continue
                      
                      # Lines starting with + or space are in new file
                      if line.startswith('+') or line.startswith(' '):
                          positions[current_line] = diff_position
                          current_line += 1
                      # Lines starting with - are only in old file (skip line increment)
                  
                  return positions
              
              # Build position map for all files
              file_positions = {}
              for file_info in files_data:
                  filename = file_info['filename']
                  patch = file_info.get('patch', '')
                  file_positions[filename] = parse_patch_positions(patch)
              
              comments = []
              for result in semgrep_data.get('results', []):
                  path = result.get('path', '').lstrip('./')
                  line = result.get('start', {}).get('line', 0)
                  check_id = result.get('check_id', 'unknown')
                  message = result.get('extra', {}).get('message', result.get('message', 'Security issue detected'))
                  severity = result.get('extra', {}).get('severity', 'WARNING').upper()
                  
                  # Map severity
                  sev_map = {'ERROR': 'HIGH', 'WARNING': 'MEDIUM', 'INFO': 'LOW'}
                  mapped_severity = sev_map.get(severity, 'MEDIUM')
                  
                  # Find diff position for this line
                  position = file_positions.get(path, {}).get(line)
                  
                  if position:
                      body = f"**[{mapped_severity}]** Semgrep: {check_id}\n\n{message}\n\nDetected by: Semgrep static analysis"
                      
                      comments.append({
                          'path': path,
                          'position': position,
                          'body': body
                      })
              
              with open('semgrep-comments.json', 'w') as f:
                  json.dump(comments, f, indent=2)
              
              print(f"Converted {len(comments)} Semgrep findings to inline comments")
          
          except Exception as e:
              print(f"Error converting Semgrep results: {e}")
              import traceback
              traceback.print_exc()
              with open('semgrep-comments.json', 'w') as f:
                  json.dump([], f)
          EOFPYTHON

      - name: Merge security findings
        if: always()
        run: |
          # Ensure files exist
          [ ! -f semgrep-comments.json ] && echo '[]' > semgrep-comments.json
          [ ! -f security-comments.json ] && echo '[]' > security-comments.json
          
          # Merge both comment sources
          python3 << 'EOFPYTHON'
          import json

          try:
              with open('semgrep-comments.json', 'r') as f:
                  semgrep = json.load(f)
              with open('security-comments.json', 'r') as f:
                  droid = json.load(f)
              
              # Combine and deduplicate
              all_comments = semgrep + droid
              
              # Sort by severity
              severity_order = {'CRITICAL': 0, 'HIGH': 1, 'MEDIUM': 2, 'LOW': 3}
              all_comments.sort(key=lambda x: severity_order.get(x.get('severity', 'LOW'), 99))
              
              with open('combined-security-comments.json', 'w') as f:
                  json.dump(all_comments, f, indent=2)
              
              print(f"Total security findings: {len(all_comments)}")
              print(f"  Semgrep: {len(semgrep)}")
              print(f"  Droid: {len(droid)}")
              
              # Count by severity
              severity_counts = {}
              for c in all_comments:
                  sev = c.get('severity', 'UNKNOWN')
                  severity_counts[sev] = severity_counts.get(sev, 0) + 1
              
              print(f"  By severity: {severity_counts}")
          
          except Exception as e:
              print(f"Error merging findings: {e}")
              with open('combined-security-comments.json', 'w') as f:
                  json.dump([], f)
          EOFPYTHON

          echo "=== Combined Security Findings ==="
          cat combined-security-comments.json

      - name: Post inline security review to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            
            if (!fs.existsSync('combined-security-comments.json')) {
              core.info('No combined findings file, skipping review');
              return;
            }
            
            const findings = JSON.parse(fs.readFileSync('combined-security-comments.json', 'utf8'));
            
            if (!Array.isArray(findings) || findings.length === 0) {
              // Post clean bill of health
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                body: '## 🔒 Security Scan Results\n\n✅ No security vulnerabilities detected.\n\n**Scanned by:**\n- Semgrep (pattern-based)\n- Droid AI (contextual analysis)\n\nAll security checks passed.'
              });
              return;
            }
            
            // Count by severity for summary
            const severityCounts = findings.reduce((acc, f) => {
              const sev = f.severity || 'UNKNOWN';
              acc[sev] = (acc[sev] || 0) + 1;
              return acc;
            }, {});
            
            const criticalCount = severityCounts['CRITICAL'] || 0;
            const highCount = severityCounts['HIGH'] || 0;
            const mediumCount = severityCounts['MEDIUM'] || 0;
            const lowCount = severityCounts['LOW'] || 0;
            
            let summary = '## 🚨 Security Scan Results\n\n';
            summary += `**Total findings:** ${findings.length}\n\n`;
            summary += '**By severity:**\n';
            if (criticalCount > 0) summary += `- 🔴 CRITICAL: ${criticalCount}\n`;
            if (highCount > 0) summary += `- 🟠 HIGH: ${highCount}\n`;
            if (mediumCount > 0) summary += `- 🟡 MEDIUM: ${mediumCount}\n`;
            if (lowCount > 0) summary += `- 🔵 LOW: ${lowCount}\n`;
            summary += '\n**Scanned by:** Semgrep + Droid AI\n\n';
            summary += 'See inline comments for details on each issue.';
            
            // Post inline review with comments
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                body: summary,
                comments: findings.map(f => ({
                  path: f.path,
                  position: f.position,
                  body: f.body
                }))
              });
              core.info(`Posted inline review with ${findings.length} security comments`);
            } catch (error) {
              core.warning(`Failed to post inline review: ${error.message}`);
              // Fallback: post as issue comment
              let detailedReport = summary + '\n\n---\n\n';
              findings.forEach((f, i) => {
                detailedReport += `### ${i+1}. ${f.path} (line/pos ${f.position})\n\n`;
                detailedReport += `${f.body}\n\n`;
                detailedReport += `---\n\n`;
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: detailedReport
              });
              core.info(`Posted fallback comment with ${findings.length} findings`);
            }

      - name: Upload security scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ github.event.pull_request.number }}
          path: |
            semgrep-results.json
            semgrep-comments.json
            security-comments.json
            combined-security-comments.json
            .git/security_review/*.json
            .git/security_review/diff.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Check for blocking issues (STRICT MODE)
        run: |
          if [ ! -f combined-security-comments.json ]; then
            echo "✅ No findings file - passing"
            exit 0
          fi
          
          FINDING_COUNT=$(jq 'length' combined-security-comments.json 2>/dev/null || echo "0")
          
          if [ "$FINDING_COUNT" -gt 0 ]; then
            echo "❌ SECURITY ISSUES FOUND: $FINDING_COUNT"
            echo ""
            echo "Security vulnerabilities detected. This PR is blocked from merging."
            echo "Please review the security findings comment in this PR."
            echo ""
            echo "Severity breakdown:"
            jq -r 'group_by(.severity) | .[] | "\(.[0].severity): \(length)"' combined-security-comments.json || echo "Unable to parse severity"
            exit 1
          fi
          
          echo "✅ No security issues detected - passing"
