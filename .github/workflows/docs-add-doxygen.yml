name: Add Doxygen Comments
on:
  pull_request

concurrency:
  group: docs-add-doxygen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest-doxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/droid --version

      - name: Prepare context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.git/pr_context';
            fs.mkdirSync(path, { recursive: true });

            const prNumber = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const reduced = files.map(f => ({ filename: f.filename, patch: f.patch }));
            fs.writeFileSync(`${path}/files.json`, JSON.stringify(reduced, null, 2));

            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            try {
              const diff = execSync(`git diff ${base}...${head}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              fs.writeFileSync(`${path}/diff.txt`, diff);
            } catch (e) {
              fs.writeFileSync(`${path}/diff.txt`, '');
            }

      - name: Get changed C files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(c|h)$' > files.txt || true
          if [ -s files.txt ]; then
            echo "has_c_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_c_files=false" >> $GITHUB_OUTPUT
          fi
          cat files.txt

      - name: Suggest Doxygen comments
        if: steps.changed-files.outputs.has_c_files == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY_PROD }}
        timeout-minutes: 10
        run: |
          cp .git/pr_context/files.json ./files.json
          cp .git/pr_context/diff.txt ./diff.txt

          echo "Files prepared:"
          ls -la *.json *.txt diff.txt 2>/dev/null || true

          cat > prompt.txt << 'EOF'
          You are an automated documentation system. Review the PR diff and suggest Doxygen-style documentation comments for functions that lack them.

          Input files (already in current directory):
          - diff.txt: the code changes to review
          - files.json: file patches with line numbers for positioning comments
          - files.txt: list of changed C/H files

          Task: Create comments.json with this exact format:
          [{ "path": "path/to/file.c", "position": 42, "body": "Your comment here" }]

          Documentation rules:
          - Use /** ... */ Doxygen style
          - Include @brief description, @param for each parameter, @return for return value
          - Only suggest for functions lacking documentation

          Comment format (body):
          - DO NOT use GitHub suggestion blocks (```suggestion) - they will delete code
          - Instead, write a plain text comment that:
            1. Explains why documentation is needed
            2. Provides the exact Doxygen comment to add ABOVE the function (in a code block using triple backticks)
          - Example body format:
            "This function lacks documentation. Add this Doxygen comment above the function:\n```c\n/**\n * @brief Description here\n * @param x description\n * @return description\n */\n```"
          - Keep language precise and technical. No emojis.

          Positioning:
          - Use the "position" value derived from files.json patches (diff line numbers, not file line numbers).
          - Only comment on changed lines; ensure the position maps to a line present in the diff hunk.

          Output:
          - Write comments.json containing either [] or an array of objects with path, position, body as specified above.
          EOF

          echo "Running droid exec..."
          droid exec --output-format debug --auto medium --model gpt-5.2 -f prompt.txt 2>&1

          if [ ! -f comments.json ]; then
            echo "No comments.json created, writing empty array"
            echo "[]" > comments.json
          fi

          echo "=== Contents of comments.json ==="
          cat comments.json

      - name: Submit inline suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            if (!fs.existsSync('comments.json')) {
              core.info('comments.json missing; skipping');
              return;
            }

            const comments = JSON.parse(fs.readFileSync('comments.json','utf8'));
            if (!Array.isArray(comments) || comments.length === 0) {
              core.info('No Doxygen suggestions needed');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'COMMENT',
              body: 'Automated Doxygen documentation suggestions',
              comments: comments
            });
